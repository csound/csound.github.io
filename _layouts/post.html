---
layout: default
---

<div class="container-fluid page-banner-background">
  <div class="container page-banner">
    <div class="mb-2">
      <a href="{{ '/news.html' | relative_url }}" class="cs-badge cs-badge-primary text-decoration-none">
        <i class="fa fa-arrow-left" aria-hidden="true"></i> All News &amp; Releases
      </a>
      {% if page.date %}
      <span class="cs-news-date ms-2"><i class="fa fa-calendar-o" aria-hidden="true"></i> {{ page.date | date_to_string }}</span>
      {% endif %}
    </div>
    <h1 class="display-7">{{ page.title }}</h1>
  </div>
</div>

<div class="container-fluid page-background">
  <div class="container">
    <div class="page">
      <div class="row">
        <div class="col-xl-9 col-lg-10 col-md-12">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</div>
