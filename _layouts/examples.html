---
layout: default
---

<div class="container-fluid page-banner-background">
  <div class="container page-banner">
    {% if page.permalink != "/examples.html" %}
    <div class="mb-2">
      <a href="{{ '/examples.html' | relative_url }}" class="cs-badge cs-badge-primary text-decoration-none">
        <i class="fa fa-arrow-left" aria-hidden="true"></i> All Interactive Examples
      </a>
    </div>
    {% endif %}
    <h1 class="display-7">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-banner-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</div>

<div class="container-fluid page-background">
  <div class="container">
    <div class="page">
      <div class="row">
        <div class="col-xl-10 col-lg-10 col-md-12 col-sm-12">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</div>
